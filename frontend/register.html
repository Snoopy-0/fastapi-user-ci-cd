<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 2rem auto; }
    form { display: flex; flex-direction: column; gap: 0.5rem; }
    label { display: flex; flex-direction: column; font-size: 0.9rem; }
    input { padding: 0.4rem; }
    button { padding: 0.5rem; margin-top: 0.5rem; cursor: pointer; }
    #error { color: red; min-height: 1.2rem; }
    #message { color: green; min-height: 1.2rem; }
  </style>
</head>
<body>
  <h1>Register</h1>

  <div id="error"></div>
  <div id="message"></div>

  <form id="register-form">
    <label>
      Username
      <input type="text" id="username" required minlength="3" />
    </label>
    <label>
      Email
      <input type="email" id="email" required />
    </label>
    <label>
      Password
      <input type="password" id="password" required minlength="6" />
    </label>
    <button type="submit">Register</button>
  </form>

  <p>Already registered? <a href="/login">Login</a></p>

  <script>
    const form = document.getElementById("register-form");
    const errorEl = document.getElementById("error");
    const messageEl = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorEl.textContent = "";
      messageEl.textContent = "";

      const username = document.getElementById("username").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const response = await fetch("/users/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, email, password }),
        });

        const data = await response.json();

        if (response.ok) {
          if (data.access_token) {
            localStorage.setItem("authToken", data.access_token);
          }
          messageEl.textContent = "Registration successful! Redirecting...";
          window.location.href = "/calculations.html";
        } else {
          errorEl.textContent = data.detail || "Registration failed.";
        }
      } catch (err) {
        console.error(err);
        errorEl.textContent = "Network error. Please try again.";
      }
    });
  </script>
</body>
</html>

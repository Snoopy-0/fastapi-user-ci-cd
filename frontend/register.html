<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 2rem auto; }
    form { display: flex; flex-direction: column; gap: 0.5rem; }
    label { display: flex; flex-direction: column; font-size: 0.9rem; }
    input { padding: 0.4rem; }
    button { padding: 0.5rem; margin-top: 0.5rem; cursor: pointer; }
    #error { color: red; min-height: 1.2rem; }
    #message { color: green; min-height: 1.2rem; }
  </style>
</head>
<body>
  <h1>Register</h1>

  <form id="register-form" novalidate>
    <label>
      Email
      <input type="email" name="email" id="email" required />
    </label>

    <label>
      Username
      <input type="text" name="username" id="username" required minlength="3" />
    </label>

    <label>
      Password
      <input type="password" name="password" id="password" required minlength="6" />
    </label>

    <label>
      Confirm Password (optional)
      <input type="password" name="confirmPassword" id="confirmPassword" />
    </label>

    <button type="submit">Register</button>
  </form>

  <p id="error"></p>
  <p id="message"></p>

  <script>
    const form = document.getElementById("register-form");
    const errorEl = document.getElementById("error");
    const messageEl = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      messageEl.textContent = "";

      const email = document.getElementById("email").value.trim();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (!email || !email.includes("@")) {
        errorEl.textContent = "Please enter a valid email.";
        return;
      }
      if (!password || password.length < 6) {
        errorEl.textContent = "Password must be at least 6 characters.";
        return;
      }
      if (confirmPassword && password !== confirmPassword) {
        errorEl.textContent = "Passwords do not match.";
        return;
      }

      try {
        const response = await fetch("/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, username, password }),
        });

        const data = await response.json();

        if (response.ok) {
          if (data.access_token) {
            localStorage.setItem("authToken", data.access_token);
          }
          messageEl.textContent = "Registration successful!";
        } else {
          errorEl.textContent = data.detail || "Registration failed.";
        }
      } catch (err) {
        console.error(err);
        errorEl.textContent = "Network error. Please try again.";
      }
    });
  </script>
</body>
</html>
